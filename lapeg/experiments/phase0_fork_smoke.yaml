# Phase 0 acceptance: fork mainnet, read a Morpho Blue market, snapshot, mutate, revert, confirm restored.
# Run: python scripts/run_experiment.py experiments/phase0_fork_smoke.yaml
name: phase0_fork_smoke
seed: 0

fork:
  rpc_url_env: ARCHIVE_RPC_URL
  # Non-archive public RPC: serves state for roughly the last 128 blocks only, so it is used only when
  # ARCHIVE_RPC_URL is unset, together with allow_recent_block. Runs on it cannot be replayed later.
  fallback_rpc_url: https://ethereum-rpc.publicnode.com
  block: null               # pin a block number here once ARCHIVE_RPC_URL is set
  allow_recent_block: true  # with no pinned block: fork at head - recent_block_lag
  recent_block_lag: 8

morpho_discovery: data/discovered/morpho_blue.json
market:
  name: PT-reUSD-10DEC2026
  market_id: "0x1e9d614631a7df0ec07fb05b2c8cb2491575fd1a63a33bf187a6afb295a4fc64"

cache_path: data/raw/rpc_cache.sqlite
results_dir: data/results
